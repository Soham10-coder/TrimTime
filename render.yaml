services:
  # Backend Flask API Web Service (Free Tier)
  - type: web
    name: trimtime-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production

  # Frontend Vite Static Site (Free Tier)
  - type: web
    name: trimtime-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://trimtime-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
